[package]
name = "distllm-relay"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
rmp = "0.8.15"
rmpv = "1.3.1"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "signal"] }
uuid = { version = "1.29.0", features = ["v4"] }
