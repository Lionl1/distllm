[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "distllm"
version = "0.1.0"
description = "A fault-tolerant distributed LLM inference framework for unstable nodes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Developer", email = "dev@example.com" }
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "httpx>=0.24.0",
    "typer>=0.9.0",
    "msgpack>=1.0.0",
    "msgpack-numpy>=0.4.8",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
distllm = "distllm.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/distllm"]
