[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "distllm"
version = "0.2.0"
description = "Fault-tolerant pipeline-parallel LLM inference across unreliable nodes (e.g. free Colab GPUs) through a single relay."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Lionl1" }
]
keywords = ["llm", "inference", "distributed", "pipeline-parallelism", "speculative-decoding", "colab", "transformers"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.56.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "httpx>=0.24.0",
    "typer>=0.9.0",
    "msgpack>=1.0.0",
    "msgpack-numpy>=0.4.8",
    "numpy>=1.24.0",
    "safetensors>=0.4.0",
    "huggingface_hub>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/Lionl1/distllm"
Documentation = "https://github.com/Lionl1/distllm/tree/main/docs"
Changelog = "https://github.com/Lionl1/distllm/blob/main/CHANGELOG.md"

[project.optional-dependencies]
quantization = [
    "bitsandbytes>=0.46.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
distllm = "distllm.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/distllm"]
