name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python-version: "3.10" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: macos-latest, python-version: "3.12" }
          - { os: windows-latest, python-version: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('tests/**/*.py') }}
          restore-keys: hf-${{ runner.os }}-
      - name: Install
        run: uv sync --extra test --extra quantization
      - name: Test
        run: uv run pytest -q

  chaos:
    name: chaos (ubuntu, both relays)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: relay-rs
      - name: Build the Rust relay
        working-directory: relay-rs
        run: cargo build --release
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Chaos tests (kill, freeze, partition, relay restart)
        run: |
          uv sync --extra test
          uv run pytest -q -m chaos tests/test_chaos.py

  rust-relay:
    name: rust-relay (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: relay-rs
      - name: Build, lint, unit tests
        working-directory: relay-rs
        run: |
          cargo fmt --check
          cargo clippy --release -- -D warnings
          cargo test --release
          cargo build --release
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('tests/**/*.py') }}
          restore-keys: hf-${{ runner.os }}-
      - name: Conformance and integration tests against the Rust relay
        run: |
          uv sync --extra test
          uv run pytest -q tests/test_relay_http.py
          DISTLLM_TEST_RELAY=rust uv run pytest -q tests/test_integration.py
