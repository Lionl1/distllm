name: bench-petals

# Manual comparison run: Petals and distllm on the same Linux runner (CPU).
on:
  workflow_dispatch:
  push:
    branches: [bench/petals-linux]

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Petals (Python 3.11, torch 2.1)
        continue-on-error: true
        run: |
          uv venv -p 3.11 /tmp/petals
          # Petals 2.2 (2023) with today's dependencies (protobuf 7) runs forward passes but
          # every inference session breaks; resolve everything as of its time instead.
          printf 'setuptools<70\ngrpcio-tools<1.61\nprotobuf<4.26\n' > /tmp/bc.txt
          uv pip install -p /tmp/petals/bin/python --index-url https://download.pytorch.org/whl/cpu torch==2.1.2
          uv pip install -p /tmp/petals/bin/python --exclude-newer 2024-02-01 --build-constraint /tmp/bc.txt \
            petals==2.2.0.post1 torch==2.1.2
          PY=/tmp/petals/bin/python bash benchmarks/petals/run.sh > petals.txt 2>&1
          grep -E "RESULT|KILLED|Route found|warm-up" petals.txt | cut -c1-200
      - name: distllm (same machine)
        run: |
          uv sync --extra test
          uv run python benchmarks/bench_pipeline.py --model-id HuggingFaceTB/SmolLM2-360M \
            --new-tokens 48 --modes distllm,route --output /tmp/distllm-loopback.md
          uv run python benchmarks/bench_pipeline.py --model-id HuggingFaceTB/SmolLM2-360M \
            --draft-model-id HuggingFaceTB/SmolLM2-135M --new-tokens 48 \
            --worker-rtt-ms 60 --client-rtt-ms 20 --modes distllm,route,spec-6 --output /tmp/distllm-network.md
          cat /tmp/distllm-loopback.md /tmp/distllm-network.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: petals-logs
          path: |
            petals.txt
            benchmarks/petals/*.log
      - name: Summary
        if: always()
        run: |
          { echo '### Petals'; echo '```'; grep -E "RESULT|KILLED|prompt|Route found|Caught exception" petals.txt | cut -c1-200 || true; echo '```';
            cat /tmp/distllm-loopback.md /tmp/distllm-network.md 2>/dev/null; } >> "$GITHUB_STEP_SUMMARY"
